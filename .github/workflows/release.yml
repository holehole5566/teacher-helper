name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build Windows application
        run: wails build -platform windows/amd64 -ldflags "-X main.version=${{ github.ref_name }}"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: teacher-wails-windows-amd64
          path: build/bin/teacher-wails.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux (amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Run regression tests
        run: |
          go test ./internal/...
          npm ci --prefix frontend
          npm test --prefix frontend

      - name: Build Linux application
        run: wails build -platform linux/amd64 -tags webkit2_41 -ldflags "-X main.version=${{ github.ref_name }}"

      - name: Package Linux application
        run: tar -czf teacher-wails-linux-amd64.tar.gz -C build/bin teacher-wails

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: teacher-wails-linux-amd64
          path: teacher-wails-linux-amd64.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
